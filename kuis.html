<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis - Buku Catatan Bahasa Inggris</title>
<meta name="description" content="Buku catatan bahasa Inggris interaktif dengan fitur AI Tutor Suara, Pelafalan 3D, Kosakata, dan Kuis.">
<meta property="og:title" content="Buku Bahasa Inggris Interaktif">
<meta property="og:description" content="Belajar bahasa Inggris dengan asisten AI dan mascot 3D secara interaktif.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .quiz-box{
    background:#fff; padding:30px 24px; border:2px solid var(--ink);
    border-radius:12px; box-shadow:4px 5px 0 var(--shadow); max-width:600px;
    margin-top:20px;
  }
  .q-meta{display:flex; justify-content:space-between; color:var(--ink-soft); font-size:0.85rem; font-weight:700; margin-bottom:12px; text-transform:uppercase;}
  .q-text{font-family:'Kalam',cursive; font-size:1.6rem; margin-bottom:24px; line-height:1.3;}
  .opts{display:flex; flex-direction:column; gap:12px;}
  .opt{
    display:flex; align-items:center; gap:14px; padding:12px 16px; border:2px solid var(--ink);
    border-radius:8px; cursor:pointer; background:var(--page); text-align:left;
    font-size:1rem; font-weight:600; transition:transform .1s;
  }
  .opt:hover:not([disabled]){transform:translateY(-2px); box-shadow:2px 2px 0 var(--shadow);}
  .opt.correct{background:var(--correct-bg); border-color:var(--correct);}
  .opt.correct .let{border-color:var(--correct); color:var(--correct);}
  .opt.wrong{background:var(--wrong-bg); border-color:var(--wrong);}
  .opt.wrong .let{border-color:var(--wrong); color:var(--wrong);}
  .opt[disabled]{cursor:default;}
  .let{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:0.9rem;
  }
  .feedback{
    margin-top:20px; padding:16px; border-radius:8px; display:none;
    animation:fadein .3s ease;
  }
  @keyframes fadein{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }
  .feedback.show{display:block;}
  .feedback.correct{background:var(--correct-bg); border-left:4px solid var(--correct);}
  .feedback.wrong{background:var(--wrong-bg); border-left:4px solid var(--wrong);}
  .f-head{font-family:'Kalam',cursive; font-size:1.3rem; margin-bottom:6px;}
  
  .q-result{text-align:center; padding:20px 0;}
  .stamp{
    display:inline-block; border:4px solid var(--tab-quiz); color:var(--tab-quiz);
    padding:16px 32px; border-radius:10px; transform:rotate(-4deg);
    font-family:'Kalam',cursive; font-size:2.5rem; margin-bottom:16px;
  }
  
  .quiz-setup{text-align:center; padding:20px 0;}
</style>
<script src="assets/nav.js"></script>
</head>
<body>
<div class="notebook">
  <div class="holes">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <app-nav active="kuis"></app-nav>

  <main>
    <section>
      <div class="section-head">
        <h2><span class="eyebrow" style="background:var(--tab-quiz)"></span>Kuis Uji Ingatan</h2>
        <p>Mari tes pemahaman kosakatamu dan tata bahasamu! Jangan takut salah, dari salah kita belajar.</p>
      </div>

      <div class="quiz-box" id="quizContainer">
        <!-- Setup -->
        <div class="quiz-setup">
          <p style="margin-bottom:20px;">Pilih tingkat kesulitan untuk memulai 10 soal acak.</p>
          <div style="display:flex; justify-content:center; gap:10px;">
            <button class="btn btn-primary" onclick="startQuiz('dasar')">Pemula</button>
            <button class="btn btn-primary" onclick="startQuiz('menengah')">Menengah</button>
            <button class="btn btn-primary" onclick="startQuiz('lanjut')">Lanjut</button>
            <button class="btn btn-ghost" onclick="startQuiz('all')">Campur Semua</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="assets/quiz-data.js"></script>
<script>
  let questions = [];
  let currentQ = 0;
  let score = 0;
  let hasAnswered = false;
  const container = document.getElementById('quizContainer');

  function startQuiz(lvl) {
    let pool = window.quizData;
    if(lvl !== 'all') pool = pool.filter(q => q.level === lvl);
    
    // shuffle and pick 10
    pool.sort(() => 0.5 - Math.random());
    questions = pool.slice(0, 10);
    
    currentQ = 0;
    score = 0;
    renderQuestion();
  }

  function renderQuestion() {
    if(currentQ >= questions.length) {
      showResult();
      return;
    }

    const q = questions[currentQ];
    hasAnswered = false;
    
    const letters = ['A','B','C','D'];
    let optsHtml = '';
    q.options.forEach((opt, i) => {
      optsHtml += `<button class="opt" onclick="answer(${i})"><span class="let">${letters[i]}</span> <span>${opt}</span></button>`;
    });

    container.innerHTML = `
      <div class="q-meta">
        <span>Soal ${currentQ + 1} dari ${questions.length}</span>
        <span style="color:var(--tab-quiz)">Kategori: ${q.cat}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="opts" id="optContainer">
        ${optsHtml}
      </div>
      <div id="feedbackBox" class="feedback">
        <div class="f-head" id="fHead"></div>
        <div id="fText"></div>
      </div>
      <div style="text-align:right; margin-top:24px; display:none;" id="nextWrap">
        <button class="btn btn-primary" onclick="nextQuestion()">${currentQ === questions.length - 1 ? 'Selesai' : 'Lanjut →'}</button>
      </div>
    `;
  }

  function answer(idx) {
    if(hasAnswered) return;
    hasAnswered = true;
    
    const q = questions[currentQ];
    const isCorrect = (idx === q.correct);
    if(isCorrect) score++;

    const opts = document.getElementById('optContainer').children;
    for(let i=0; i<opts.length; i++){
      opts[i].setAttribute('disabled', 'true');
      if(i === q.correct) opts[i].classList.add('correct');
      else if(i === idx) opts[i].classList.add('wrong');
    }

    const fBox = document.getElementById('feedbackBox');
    fBox.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
    document.getElementById('fHead').textContent = isCorrect ? 'Benar Sekali! 🎉' : 'Belum Tepat 😥';
    document.getElementById('fText').innerHTML = `<b>Penjelasan:</b> ${q.explain}`;
    
    document.getElementById('nextWrap').style.display = 'block';
  }

  function nextQuestion() {
    currentQ++;
    renderQuestion();
  }

  function showResult() {
    let title, msg;
    const pct = Math.round((score / questions.length) * 100);
    
    if(pct >= 80){ title='Keren!'; msg='Luar biasa, materi sudah menempel di kepala.'; }
    else if(pct >= 50){ title='Lumayan!'; msg='Bagus, tapi masih perlu di-review lagi catatan tata bahasanya ya.'; }
    else{ title='Oops!'; msg='Tidak apa-apa. Jangan menyerah, baca lagi catatan kosakatanya.'; }

    container.innerHTML = `
      <div class="q-result">
        <div class="stamp">${pct}%</div>
        <div class="q-text">${title}</div>
        <p>${msg}</p>
        <br>
        <button class="btn btn-primary" onclick="location.reload()">Ulangi Kuis</button>
      </div>
    `;
    
    // Save stat
    try{
      let stats = JSON.parse(localStorage.getItem('quizStats') || '[]');
      stats.push(pct);
      localStorage.setItem('quizStats', JSON.stringify(stats.slice(-10))); // keep last 10
    }catch(e){}
  }
</script>
</body>
</html>
