<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tanya AI Luna - Call Mode</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  :root { --tab-ai:#D35400; }
  body { background:var(--page); margin:0; overflow-x:hidden; }

  /* FULL VOICE UI LAYOUT */
  .voice-app-container {
    display:flex; flex-direction:column; height:calc(100vh - 70px); max-height:900px;
    max-width:800px; margin:10px auto 0;
    border:2px solid var(--ink); border-radius:20px; box-shadow:6px 8px 0 var(--shadow);
    background:#FFFdf7; overflow:hidden; position:relative;
  }

  /* TOP BAR */
  .voice-header {
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px; border-bottom:2px solid var(--ink); background:var(--highlight);
  }
  .voice-header h1 { margin:0; font-family:'Kalam', cursive; font-size:1.6rem; display:flex; align-items:center; gap:10px; }
  .btn-settings { background:var(--paper); border:2px solid var(--ink); border-radius:8px; padding:6px 12px; font-weight:800; cursor:pointer; }
  
  /* CENTER 3D AVATAR (Takes up most space) */
  .avatar-stage {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 50%, #fff4e5, #F0E0C4); position:relative;
  }
  .avatar-canvas-wrap { width:100%; height:100%; max-height:45vh; display:flex; justify-content:center; }
  #avatarCanvas { width:100%; height:100%; max-width:400px; }
  
  /* LIVE SUBTITLE (Floating Pill) */
  .subtitle-pill {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    background:rgba(38,49,74,0.85); color:#fff; border-radius:20px; padding:12px 24px;
    font-size:1.1rem; font-weight:600; text-align:center; max-width:90%;
    opacity:0; transition:opacity 0.3s; pointer-events:none; backdrop-filter:blur(4px);
  }
  .subtitle-pill.show { opacity:1; }

  /* BOTTOM CONTROLS (The Magic Orb) */
  .voice-controls {
    padding:20px; border-top:2px solid var(--ink); background:var(--paper);
    display:flex; flex-direction:column; align-items:center; gap:20px;
  }
  .orb-wrapper { position:relative; display:flex; justify-content:center; align-items:center; width:100%; }
  
  .btn-orb {
    width:90px; height:90px; border-radius:50%; border:3px solid var(--ink);
    background:var(--tab-ai); color:#fff; font-size:2rem; cursor:pointer;
    box-shadow:0 8px 0 var(--ink); transition:all 0.15s; display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .btn-orb:active { transform:translateY(6px); box-shadow:0 2px 0 var(--ink); }
  
  /* Pulse animation when call is active */
  .orb-rings { position:absolute; inset:0; pointer-events:none; display:flex; justify-content:center; align-items:center; }
  .orb-ring {
    position:absolute; width:90px; height:90px; border-radius:50%; border:3px solid var(--tab-ai);
    opacity:0; animation:none;
  }
  
  .mode-active .btn-orb { background:#E74C3C; }
  .mode-active .orb-ring { animation:ringPulse 2s infinite cubic-bezier(.36,.11,.89,.32); }
  .mode-active .orb-ring:nth-child(2) { animation-delay:0.6s; }
  .mode-active .orb-ring:nth-child(3) { animation-delay:1.2s; }
  
  @keyframes ringPulse { 0% { transform:scale(1); opacity:0.8; } 100% { transform:scale(2.5); opacity:0; } }

  .status-text { font-weight:800; font-size:1.2rem; color:var(--ink); text-align:center; }
  
  /* SETTINGS MODAL */
  .settings-modal {
    position:absolute; inset:0; background:rgba(255,253,247,0.95); backdrop-filter:blur(10px);
    z-index:10; display:flex; flex-direction:column; padding:30px; transform:translateY(100%);
    transition:transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .settings-modal.open { transform:translateY(0); }
  .settings-modal h2 { margin:0 0 20px; font-family:'Kalam', cursive; border-bottom:2px solid var(--ink); padding-bottom:10px; }
  .settings-modal .close-btn { position:absolute; top:20px; right:20px; font-size:1.5rem; background:none; border:none; cursor:pointer; }
  
  .setting-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-weight:600; font-size:1.1rem; }
  .setting-row select { padding:10px; border:2px solid var(--ink); border-radius:8px; font-size:1rem; outline:none; max-width:200px; }
  
  /* Switch */
  .switch { position:relative; display:inline-block; width:54px; height:30px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#D8D2C2; border:2px solid var(--ink); border-radius:20px; cursor:pointer; transition:.2s; }
  .slider::before { content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border:2px solid var(--ink); border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:var(--tab-ai); }
  .switch input:checked + .slider::before { transform:translateX(24px); }

  @media (max-width:640px){
    .voice-app-container { height:calc(100vh - 60px); border-radius:0; border:none; margin-top:0; border-top:2px solid var(--ink); }
    .avatar-canvas-wrap { max-height:40vh; }
    .subtitle-pill { font-size:0.95rem; padding:10px 16px; bottom:10px; width:95%; }
    .btn-orb { width:76px; height:76px; font-size:1.6rem; }
    .orb-ring { width:76px; height:76px; }
  }
</style>
<script src="assets/nav.js"></script>
</head>
<body>
<div class="notebook" style="padding:0; min-height:100vh;">
  <app-nav active="ai"></app-nav>

  <main style="padding:0;">
    <div class="voice-app-container" id="appContainer">
      
      <div class="voice-header">
        <h1>🗣️ Panggilan Luna</h1>
        <button class="btn-settings" id="btnSettings">⚙️ Pengaturan</button>
      </div>

      <div class="avatar-stage">
        <div class="avatar-canvas-wrap"><canvas id="avatarCanvas"></canvas></div>
        <div class="subtitle-pill" id="subtitlePill">Halo! Aku Luna.</div>
      </div>

      <div class="voice-controls">
        <div class="orb-wrapper" id="orbWrap">
          <div class="orb-rings"><div class="orb-ring"></div><div class="orb-ring"></div><div class="orb-ring"></div></div>
          <button class="btn-orb" id="btnOrb">📞</button>
        </div>
        <div class="status-text" id="statusText">Tekan 📞 untuk mulai nelpon</div>
      </div>

      <!-- Settings Panel -->
      <div class="settings-modal" id="settingsModal">
        <button class="close-btn" id="btnCloseSettings">❌</button>
        <h2>Pengaturan Panggilan</h2>
        <div class="setting-row">
          <span>Suara Luna</span>
          <select id="voiceSelect"><option value="">Memuat...</option></select>
        </div>
        <div class="setting-row">
          <span>Bahasa Mikrofon Anda</span>
          <select id="micLangSelect">
            <option value="en-US">English (Inggris)</option>
            <option value="id-ID">Indonesia</option>
          </select>
        </div>
        <div class="setting-row">
          <span>Luna Balas Full English</span>
          <label class="switch"><input type="checkbox" id="replyEnglishToggle" checked><span class="slider"></span></label>
        </div>
        <div style="margin-top:auto; font-size:0.85rem; color:#666; text-align:center;">
          Sistem ngobrol ini 100% menggunakan suara. Bicaralah dan Luna akan merespons langsung. Tidak perlu mengetik.
        </div>
      </div>
      
    </div>
  </main>
</div>

<script src="assets/three.min.js"></script>
<script src="tanya-ai-3d.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  
  // UI State
  let isCalling = false;
  let isAiSpeaking = false;
  let isThinking = false;
  let recTimer, resumeTimer;
  let chosenVoice = null;
  let history = []; // Conversation context

  // DOM Elements
  const orbWrap = $('orbWrap');
  const btnOrb = $('btnOrb');
  const statusText = $('statusText');
  const subtitlePill = $('subtitlePill');
  const settingsModal = $('settingsModal');
  
  // Settings
  $('btnSettings').onclick = () => settingsModal.classList.add('open');
  $('btnCloseSettings').onclick = () => settingsModal.classList.remove('open');

  function showSubtitle(text, isLuna=true) {
    if(!text) { subtitlePill.classList.remove('show'); return; }
    subtitlePill.textContent = (isLuna ? '🤖 ' : '🗣️ ') + text;
    subtitlePill.classList.add('show');
  }
  
  function updateStatus(text, avatarEmotion='idle') {
    statusText.textContent = text;
    if(window.setAvatarState) window.setAvatarState(avatarEmotion);
  }

  // ==== TTS Setup ====
  function loadVoices() {
    if(!window.speechSynthesis) return;
    const pool = window.speechSynthesis.getVoices().filter(v=>/^(en|id)/i.test(v.lang)).sort((a,b)=>(b.name.includes('Google')?100:0)-(a.name.includes('Google')?100:0));
    const sel = $('voiceSelect');
    sel.innerHTML = '';
    pool.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name; sel.appendChild(o); });
    if(pool.length) chosenVoice = pool[0];
  }
  if(window.speechSynthesis){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  $('voiceSelect').onchange = (e) => {
    chosenVoice = window.speechSynthesis.getVoices().find(v => v.name === e.target.value);
  };

  function speak(text) {
    if(!window.speechSynthesis || !text) return afterSpeak();
    
    // Clean markdown for speech
    const clean = text.replace(/[*_#`~>|]/g, '').replace(/<[^>]*>/g, '').replace(/\([^)]*\)/g, '').trim();
    if(!clean) return afterSpeak();

    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    if(chosenVoice) u.voice = chosenVoice;
    else u.lang = 'en-US';
    
    u.rate = 1.05; u.pitch = 1.02;
    
    u.onstart = () => {
      isAiSpeaking = true;
      updateStatus("Luna sedang bicara...", "speaking");
      showSubtitle(clean, true);
    };
    
    u.onend = afterSpeak;
    u.onerror = afterSpeak;
    
    window.speechSynthesis.speak(u);
  }

  function afterSpeak() {
    isAiSpeaking = false;
    showSubtitle("");
    if(isCalling) {
      updateStatus("Luna mendengarkanmu...", "listening");
      openMic(300);
    } else {
      updateStatus("Panggilan berakhir.", "idle");
    }
  }

  // ==== AI LOGIC ====
  const k = ['AQ.Ab8RN6KOIxf','mckfNAEkMz9A49','TNFz_REwJdtiPRLEq','jLAXA9DQ'].join('');
  const API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=' + k;

  async function sendToAi(userText) {
    if(!isCalling) return;
    
    showSubtitle(userText, false);
    updateStatus("Luna sedang berpikir...", "idle");
    isThinking = true;
    
    history.push({ role: 'user', parts: [{ text: userText }] });
    // Keep history small for speed
    if(history.length > 6) history = history.slice(history.length - 6);

    const isFullEng = $('replyEnglishToggle').checked;
    const prompt = "Kamu adalah Luna, partner ngobrol suara (Voice Call) yang ramah. Aturan mutlak:\n" +
      "1. Jawab SANGAT SINGKAT dan NATURAL seperti obrolan telepon sungguhan (1-2 kalimat pendek saja, maks 20 kata).\n" +
      "2. DILARANG menggunakan markdown, bintang, emoji, atau teks format panjang karena ini dibacakan oleh TTS AI.\n" +
      "3. " + (isFullEng ? "Selalu gunakan BAHASA INGGRIS sepenuhnya agar aku terbiasa listening." : "Ikuti bahasa yang aku gunakan (Indonesia atau Inggris).") + "\n" +
      "4. Lempar pertanyaan pendek di akhir agar obrolan terus mengalir.";

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { role: 'user', parts: [{ text: prompt }] },
          contents: history
        })
      });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const aiReply = data.candidates[0].content.parts[0].text.trim();
      
      history.push({ role: 'model', parts: [{ text: aiReply }] });
      isThinking = false;
      speak(aiReply);
    } catch(err) {
      isThinking = false;
      console.error(err);
      speak("Oops, sepertinya sinyalnya jelek. Coba ngomong lagi?");
    }
  }

  // ==== MIC / SPEECH RECOGNITION ====
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;

  function buildRec() {
    if(!SR) return null;
    const r = new SR();
    r.lang = $('micLangSelect').value;
    r.continuous = false;
    r.interimResults = true;
    let finalTxt = '';

    r.onstart = () => {
      if(!isCalling) return r.abort();
      updateStatus("Luna mendengarkanmu...", "listening");
    };

    r.onresult = (e) => {
      let interim = '';
      for(let i = e.resultIndex; i < e.results.length; i++) {
        if(e.results[i].isFinal) finalTxt += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      const txt = (finalTxt || interim).trim();
      if(txt) showSubtitle(txt, false);
    };

    r.onerror = (e) => {
      if(e.error === 'not-allowed') {
        alert("Izin Mikrofon ditolak! Izinkan di pengaturan browser Anda.");
        endCall();
      } else {
        if(isCalling && !isAiSpeaking && !isThinking) openMic(500);
      }
    };

    r.onend = () => {
      if(!isCalling) return;
      const txt = finalTxt.trim();
      if(txt) {
        sendToAi(txt);
      } else if(!isAiSpeaking && !isThinking) {
        openMic(400); // Re-open mic if silent
      }
    };
    return r;
  }

  function openMic(delay) {
    if(!SR || !isCalling || isAiSpeaking || isThinking) return;
    clearTimeout(resumeTimer);
    resumeTimer = setTimeout(() => {
      if(!isCalling || isAiSpeaking || isThinking) return;
      try {
        rec = buildRec();
        if(rec) rec.start();
      } catch(e) {
        openMic(800);
      }
    }, delay || 0);
  }

  // ==== CALL CONTROLS ====
  function startCall() {
    if(!SR) return alert("Browser ini tidak mendukung Voice API. Gunakan Chrome atau Edge!");
    isCalling = true;
    appContainer.classList.add('mode-active');
    btnOrb.textContent = "🔴";
    btnOrb.style.background = "#E74C3C";
    btnOrb.style.borderColor = "#C0392B";
    
    // Greeting
    speak("Hi there! I am Luna. What are we talking about today?");
  }

  function endCall() {
    isCalling = false;
    appContainer.classList.remove('mode-active');
    btnOrb.textContent = "📞";
    btnOrb.style.background = "var(--tab-ai)";
    btnOrb.style.borderColor = "var(--ink)";
    
    clearTimeout(resumeTimer);
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    if(rec) { try { rec.abort(); } catch(e){} }
    
    updateStatus("Tekan 📞 untuk mulai nelpon", "idle");
    showSubtitle("");
    history = [];
  }

  btnOrb.onclick = () => {
    if(isCalling) endCall(); else startCall();
  };

  // Init
  updateStatus("Tekan 📞 untuk mulai nelpon", "idle");

})();
</script>
</body>
</html>
