<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tanya AI Luna - Call Mode</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  :root { --tab-ai:#D35400; }
  body { background:var(--page); margin:0; overflow-x:hidden; }

  /* FULL VOICE UI LAYOUT */
  .voice-app-container {
    display:flex; flex-direction:column; height:calc(100vh - 70px); max-height:900px;
    max-width:800px; margin:10px auto 0;
    border:2px solid var(--ink); border-radius:20px; box-shadow:6px 8px 0 var(--shadow);
    background:#FFFdf7; overflow:hidden; position:relative;
  }

  .voice-header {
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px; border-bottom:2px solid var(--ink); background:var(--highlight);
  }
  .voice-header h1 { margin:0; font-family:'Kalam', cursive; font-size:1.6rem; display:flex; align-items:center; gap:10px; }
  .btn-settings { background:var(--paper); border:2px solid var(--ink); border-radius:8px; padding:6px 12px; font-weight:800; cursor:pointer; }
  
  .avatar-stage {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 50%, #fff4e5, #F0E0C4); position:relative;
  }
  .avatar-canvas-wrap { width:100%; height:100%; max-height:45vh; display:flex; justify-content:center; }
  #avatarCanvas { width:100%; height:100%; max-width:400px; }
  
  .subtitle-pill {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    background:rgba(38,49,74,0.85); color:#fff; border-radius:20px; padding:12px 24px;
    font-size:1.1rem; font-weight:600; text-align:center; max-width:90%;
    opacity:0; transition:opacity 0.3s; pointer-events:none; backdrop-filter:blur(4px);
  }
  .subtitle-pill.show { opacity:1; }

  .voice-controls {
    padding:20px; border-top:2px solid var(--ink); background:var(--paper);
    display:flex; flex-direction:column; align-items:center; gap:20px;
  }
  .orb-wrapper { position:relative; display:flex; justify-content:center; align-items:center; width:100%; }
  
  .btn-orb {
    width:90px; height:90px; border-radius:50%; border:3px solid var(--ink);
    background:var(--tab-ai); color:#fff; font-size:2rem; cursor:pointer;
    box-shadow:0 8px 0 var(--ink); transition:all 0.15s; display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .btn-orb:active { transform:translateY(6px); box-shadow:0 2px 0 var(--ink); }
  
  .orb-rings { position:absolute; inset:0; pointer-events:none; display:flex; justify-content:center; align-items:center; }
  .orb-ring {
    position:absolute; width:90px; height:90px; border-radius:50%; border:3px solid var(--tab-ai);
    opacity:0; animation:none;
  }
  
  .mode-active .btn-orb { background:#E74C3C; }
  .mode-active .orb-ring { animation:ringPulse 2s infinite cubic-bezier(.36,.11,.89,.32); }
  .mode-active .orb-ring:nth-child(2) { animation-delay:0.6s; }
  .mode-active .orb-ring:nth-child(3) { animation-delay:1.2s; }
  
  @keyframes ringPulse { 0% { transform:scale(1); opacity:0.8; } 100% { transform:scale(2.5); opacity:0; } }

  .status-text { font-weight:800; font-size:1.2rem; color:var(--ink); text-align:center; }
  
  .settings-modal {
    position:absolute; inset:0; background:rgba(255,253,247,0.95); backdrop-filter:blur(10px);
    z-index:10; display:flex; flex-direction:column; padding:30px; transform:translateY(100%);
    transition:transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .settings-modal.open { transform:translateY(0); }
  .settings-modal h2 { margin:0 0 20px; font-family:'Kalam', cursive; border-bottom:2px solid var(--ink); padding-bottom:10px; }
  .settings-modal .close-btn { position:absolute; top:20px; right:20px; font-size:1.5rem; background:none; border:none; cursor:pointer; }
  
  .setting-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-weight:600; font-size:1.1rem; }
  .setting-row select { padding:10px; border:2px solid var(--ink); border-radius:8px; font-size:1rem; outline:none; max-width:200px; }
  
  .switch { position:relative; display:inline-block; width:54px; height:30px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#D8D2C2; border:2px solid var(--ink); border-radius:20px; cursor:pointer; transition:.2s; }
  .slider::before { content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border:2px solid var(--ink); border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:var(--tab-ai); }
  .switch input:checked + .slider::before { transform:translateX(24px); }

  @media (max-width:640px){
    .voice-app-container { height:calc(100vh - 60px); border-radius:0; border:none; margin-top:0; border-top:2px solid var(--ink); }
    .avatar-canvas-wrap { max-height:40vh; }
    .subtitle-pill { font-size:0.95rem; padding:10px 16px; bottom:10px; width:95%; }
    .btn-orb { width:76px; height:76px; font-size:1.6rem; }
    .orb-ring { width:76px; height:76px; }
  }
</style>
<script src="assets/nav.js"></script>
</head>
<body>
<div class="notebook" style="padding:0; min-height:100vh;">
  <app-nav active="ai"></app-nav>
  <main style="padding:0;">
    <div class="voice-app-container" id="appContainer">
      <div class="voice-header">
        <h1>🗣️ Panggilan Luna (Live)</h1>
        <button class="btn-settings" id="btnSettings">⚙️ Pengaturan</button>
      </div>

      <div class="avatar-stage">
        <div class="avatar-canvas-wrap"><canvas id="avatarCanvas"></canvas></div>
        <div class="subtitle-pill" id="subtitlePill">Halo! Aku Luna.</div>
      </div>

      <div class="voice-controls">
        <div class="orb-wrapper" id="orbWrap">
          <div class="orb-rings"><div class="orb-ring"></div><div class="orb-ring"></div><div class="orb-ring"></div></div>
          <button class="btn-orb" id="btnOrb" title="Mulai / Akhiri">📞</button>
        </div>
        <div class="status-text" id="statusText">Tekan 📞 untuk ngobrol</div>
      </div>

      <div class="settings-modal" id="settingsModal">
        <button class="close-btn" id="btnCloseSettings">❌</button>
        <h2>Pengaturan Suara</h2>
        <div class="setting-row">
          <span>Karakter Luna</span>
          <select id="voiceModelSelect">
            <option value="Aoede" selected>Aoede (Hangat & Melodis)</option>
            <option value="Puck">Puck (Ceria & Ramah)</option>
            <option value="Kore">Kore (Lembut)</option>
            <option value="Charon">Charon (Tenang & Dalam)</option>
            <option value="Fenrir">Fenrir (Bersemangat)</option>
          </select>
        </div>
        <div class="setting-row">
          <span>Luna Balas Full English</span>
          <label class="switch"><input type="checkbox" id="replyEnglishToggle" checked><span class="slider"></span></label>
        </div>
        <div style="margin-top:auto; font-size:0.85rem; color:#666; text-align:center;">
          Mode ini ditenagai langsung oleh <b>Gemini Multimodal Live API</b>.
          Ngobrol santai dengan suara asli layaknya menelepon teman!
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/three.min.js"></script>
<script src="tanya-ai-3d.js"></script>
<script src="assets/luna-live.js"></script>
<script>
(function(){
  var $ = function(id) { return document.getElementById(id); };
  
  var isCalling = false;
  var btnOrb = $('btnOrb');
  var appContainer = $('appContainer');
  var statusText = $('statusText');
  var subtitlePill = $('subtitlePill');
  var subtitleTimer = null;

  $('btnSettings').onclick = function() { $('settingsModal').classList.add('open'); };
  $('btnCloseSettings').onclick = function() { $('settingsModal').classList.remove('open'); };

  function showSub(role, txt) {
    if (!txt) { subtitlePill.classList.remove('show'); return; }
    subtitlePill.textContent = (role === 'ai' ? '🤖 ' : '🗣️ ') + txt;
    subtitlePill.classList.add('show');
    clearTimeout(subtitleTimer);
    subtitleTimer = setTimeout(function(){ subtitlePill.classList.remove('show'); }, 6000);
  }

  function handleState(state) {
    if (window.setAvatarState) window.setAvatarState(state === 'connecting' || state === 'thinking' ? 'idle' : state);
    if (state === 'connecting') statusText.textContent = "Menghubungkan ke satelit...";
    else if (state === 'listening') statusText.textContent = "Luna mendengarkanmu. Bicaralah!";
    else if (state === 'thinking') statusText.textContent = "Luna memikirkan jawaban...";
    else if (state === 'speaking') statusText.textContent = "Luna sedang bicara...";
    else if (state === 'idle') statusText.textContent = "Tekan 📞 untuk ngobrol";
  }

  btnOrb.onclick = function() {
    if (isCalling) {
      LunaLive.stop();
      isCalling = false;
      appContainer.classList.remove('mode-active');
      btnOrb.textContent = "📞";
      btnOrb.style.background = "var(--tab-ai)";
      btnOrb.style.borderColor = "var(--ink)";
      showSub(null, '');
    } else {
      isCalling = true;
      appContainer.classList.add('mode-active');
      btnOrb.textContent = "🔴";
      btnOrb.style.background = "#E74C3C";
      btnOrb.style.borderColor = "#C0392B";
      
      LunaLive.start({
        voice: $('voiceModelSelect').value,
        fullEng: $('replyEnglishToggle').checked
      }, {
        onState: handleState,
        onSubtitle: showSub
      }).then(function(){
        // Beri sapaan singkat awal tanpa user harus ngomong
        LunaLive.say("Halo Luna, sapa aku dengan singkat ya!");
      }).catch(function(err){
        alert("Gagal terhubung: " + err.message);
        btnOrb.click();
      });
    }
  };
})();
</script>
</body>
</html>
